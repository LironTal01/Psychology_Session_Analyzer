
services:

  # ------------------------------------------------------
  # Upload Service
  # ------------------------------------------------------
  upload_service:
    build:
      context: .
      dockerfile: upload_service/Dockerfile
    container_name: upload_service
    ports:
      - "8000:8000"
    depends_on:
        - rabbitmq
        - minio
        - postgres
    networks:
      - backend
    environment:
      MINIO_BUCKET: videos
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: pass
      RABBITMQ_QUEUE: new_videos

  # ------------------------------------------------------
  # Audio Extractor Service (listens to new_videos queue)
  # ------------------------------------------------------
  audio_extractor_service:
    build:
      context: .
      dockerfile: audio_extractor_service/Dockerfile
    container_name: audio_extractor_service
    depends_on:
      - rabbitmq
    networks:
      - backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: pass
      RABBITMQ_QUEUE: new_videos
      AUDIO_READY_QUEUE: audio_ready

  # ------------------------------------------------------
  # Transcription Service (listens to audio_ready queue)
  # ------------------------------------------------------
  transcription_service:
    build:
      context: .
      dockerfile: transcription_service/Dockerfile
    container_name: transcription_service
    depends_on:
      - rabbitmq
    networks:
      - backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: pass
      AUDIO_READY_QUEUE: audio_ready
      TRANSCRIPTION_READY_QUEUE: transcription_ready
      TRANSCRIPTS_BUCKET: transcripts
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}

  # ------------------------------------------------------
  # LLM Analyzer Service (listens to transcription_ready queue)
  # ------------------------------------------------------
  llm_analyzer_service:
    build:
      context: .
      dockerfile: llm_analyzer_service/Dockerfile
    container_name: llm_analyzer_service
    depends_on:
      - rabbitmq
      - minio
      - postgres
      - redis
    networks:
      - backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: user
      RABBITMQ_PASSWORD: pass
      TRANSCRIPTION_READY_QUEUE: transcription_ready
      ANALYSIS_READY_QUEUE: analysis_ready
      ANALYSIS_BUCKET: analyses
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANALYSIS_DB_HOST: postgres
      ANALYSIS_DB_PORT: 5432
      ANALYSIS_DB_NAME: sessions_db
      ANALYSIS_DB_USER: admin
      ANALYSIS_DB_PASSWORD: admin123
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-5-nano
    
  # ------------------------------------------------------
  # Viewer Service
  # ------------------------------------------------------
  viewer_service:
    build:
      context: .
      dockerfile: viewer_service/Dockerfile
    container_name: viewer_service
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - backend
    environment:
      ANALYSIS_DB_HOST: postgres
      ANALYSIS_DB_PORT: 5432
      ANALYSIS_DB_NAME: sessions_db
      ANALYSIS_DB_USER: admin
      ANALYSIS_DB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379

  # ------------------------------------------------------
  # RabbitMQ (event broker)
  # ------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
    networks:
      - backend

  # ------------------------------------------------------
  # MinIO (object storage)
  # ------------------------------------------------------
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    networks:
      - backend

  # ------------------------------------------------------
  # Postgres (database)
  # ------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sessions_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # ------------------------------------------------------
  # Redis (cache for LLM analyzer)
  # ------------------------------------------------------
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  # ------------------------------------------------------
  # RedisInsight (web UI for Redis)
  # ------------------------------------------------------
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - backend
    volumes:
      - redisinsight_data:/data

  # ------------------------------------------------------
  # DataDog Agent (collect logs & metrics)
  # ------------------------------------------------------
  datadog:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog"
      DD_CONTAINER_INCLUDE: "name:.*"
      DD_PROCESS_AGENT_ENABLED: "false"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - backend
    depends_on:
      - rabbitmq
      - minio
      - postgres
      - redis

networks:
  backend:

volumes:
  minio_data:
  postgres_data:
  redisinsight_data:
